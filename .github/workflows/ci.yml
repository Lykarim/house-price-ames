name: CI — Tests & Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  tests:
    name: Tests unitaires (Python 3.11)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install dill loguru numpy pandas scikit-learn xgboost lightgbm catboost \
                      optuna optuna-integration mlflow ppscore pendulum pyarrow pytest

      - name: Installation dépendances API & monitoring
        run: pip install fastapi uvicorn httpx pytest-asyncio evidently scipy category-encoders

      - name: Exécution des tests unitaires
        run: pytest tests/ -v --tb=short --ignore=tests/test_api.py

  dvc-pipeline:
    name: DVC Pipeline (train)
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install dill loguru numpy pandas scikit-learn xgboost lightgbm catboost \
                      optuna optuna-integration mlflow ppscore pendulum pyarrow dvc

      - name: Initialisation DVC
        run: dvc init --no-scm 2>/dev/null || true

      - name: Exécution du pipeline d'entraînement
        run: python src/train_pipeline.py

      - name: Affichage des métriques
        run: |
          if [ -f metrics.json ]; then
            echo "=== Métriques du modèle ==="
            cat metrics.json
          fi

      - name: Upload métriques
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: model-metrics
          path: metrics.json

  api-tests:
    name: Tests API FastAPI
    runs-on: ubuntu-latest
    needs: dvc-pipeline

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Installation des dépendances
        run: |
          pip install --upgrade pip
          pip install dill loguru numpy pandas scikit-learn xgboost lightgbm catboost \
                      optuna mlflow ppscore pendulum pyarrow category-encoders \
                      fastapi uvicorn httpx pytest pytest-asyncio evidently scipy

      - name: Entraînement du modèle (requis pour les tests API)
        run: python src/train_pipeline.py

      - name: Tests de l'API
        run: pytest tests/test_api.py -v --tb=short

      - name: Vérification Dockerfile
        run: docker build -t laplace-immo-api . && echo "Docker build OK"

  deploy:
    name: Déploiement Railway
    runs-on: ubuntu-latest
    needs: [tests, dvc-pipeline, api-tests]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation Railway CLI
        run: curl -fsSL https://railway.app/install.sh | sh && echo "$HOME/.railway/bin" >> $GITHUB_PATH

      - name: Déploiement sur Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          railway up --detach \
            --service 8069843d-c25b-47ac-9fe1-56caeded3baa \
            --environment production

      - name: Vérification santé API
        run: |
          sleep 30
          curl -f https://clever-harmony-production-ced2.up.railway.app/health || exit 1
